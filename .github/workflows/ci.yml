name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-typecheck-test:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test

  migrations:
    name: Migrations apply cleanly on fresh DB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The supabase CLI local stack needs Docker.
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local Supabase
        run: supabase start --ignore-health-check || true
      - name: Reset & apply all migrations to a fresh local DB
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@localhost:54322/postgres
        run: |
          # Apply every checked-in migration explicitly. This avoids a stale
          # hard-coded file list silently skipping new security migrations.
          for migration in supabase/migrations/*.sql; do
            psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Assert the public Data API stays least-privileged
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@localhost:54322/postgres
        run: |
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          begin
            if has_column_privilege('authenticated', 'public.rooms', 'created_by_root', 'select') then
              raise exception 'authenticated can read rooms.created_by_root';
            end if;
            if not has_table_privilege('authenticated', 'public.rooms_public', 'select') then
              raise exception 'authenticated cannot read rooms_public';
            end if;
            -- Reading is public by design (migration 20260815193000): Rooms,
            -- threads, and profiles must stay crawlable or organic discovery
            -- goes back to zero. What anon must NEVER reach is root identity
            -- and ballots.
            if not has_table_privilege('anon', 'public.rooms_public', 'select') then
              raise exception 'anon cannot read rooms_public — public read regressed';
            end if;
            if not has_table_privilege('anon', 'public.posts', 'select') then
              raise exception 'anon cannot read posts — public read regressed';
            end if;
            if not has_table_privilege('anon', 'public.personas_public', 'select') then
              raise exception 'anon cannot read personas_public — public read regressed';
            end if;
            if has_column_privilege('anon', 'public.rooms', 'created_by_root', 'select') then
              raise exception 'anon can read rooms.created_by_root';
            end if;
            if has_table_privilege('anon', 'public.personas', 'select') then
              raise exception 'anon can read the personas base table';
            end if;
            if has_table_privilege('anon', 'public.votes', 'select')
               or has_table_privilege('anon', 'public.override_votes', 'select') then
              raise exception 'anon can read ballots';
            end if;
            if has_table_privilege('anon', 'public.room_subscriptions', 'select') then
              raise exception 'anon can read room subscriptions';
            end if;
            if has_function_privilege('anon', 'public.create_report(uuid,text,uuid,text,text)', 'execute') then
              raise exception 'anon can execute create_report';
            end if;
            if not has_function_privilege('anon', 'public.public_stats()', 'execute') then
              raise exception 'anon cannot execute public_stats';
            end if;
            if exists (
              select 1
              from pg_policies
              where schemaname = 'storage'
                and policyname in ('post_images_public_read', 'comment_images_public_read')
            ) then
              raise exception 'public Storage listing policy was restored';
            end if;
          end
          $$;
          SQL
      - if: always()
        name: Stop local Supabase
        run: supabase stop || true
